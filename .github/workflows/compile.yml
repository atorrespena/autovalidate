name: Build C++

on:
  push:
    branches: "**"
  pull_request:
    branches: [ devops ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: compile files
        run: |
          g++ -std=c++17 main.cpp
  build:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: compile actions
      - name: compile folder
        run: make clean && make